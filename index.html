<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Projets THYP 25-26</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css">

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div class="container py-4">
    <header class="mb-4 text-center">
      <h1 class="h3 mb-1">THYP 25-26 — Projets</h1>
      <div class="text-muted">Source : Google Sheets</div>
    </header>

    <!-- Barre de recherche -->
    <div class="searchbar p-3 mb-4 rounded shadow-sm bg-light">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-6">
          <input id="q" class="form-control form-control-lg" placeholder="Rechercher (titre, description, techno…)">
        </div>
        <div class="col-6 col-md-3">
          <select id="keySelect" class="form-select">
            <option value="">— Filtrer par colonne —</option>
          </select>
        </div>
        <div class="col-6 col-md-3 text-md-end">
          <a id="downloadCsv" class="btn btn-primary shadow-sm" target="_blank" rel="noopener">Télécharger le CSV</a>
        </div>
      </div>
    </div>

    <!-- Résumé -->
    <div class="mt-3 mb-3">
      <span id="count" class="muted">Chargement…</span>
    </div>

    <!-- Grille cartes -->
    <div id="grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </div>

  <!-- Modal image -->
  <div class="modal fade" id="imgModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark">
        <div class="modal-body p-0 text-center">
          <img id="modalImage" src="" class="img-fluid rounded">
        </div>
      </div>
    </div>
  </div>

  <script src="./assets/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
