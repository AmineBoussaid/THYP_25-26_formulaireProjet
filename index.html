<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets Hypermedia</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .project-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fff; }
        img { max-width: 100%; height: auto; display: block; margin-bottom: 10px; }
        iframe { width: 100%; height: 200px; margin-bottom: 10px; }
    </style>
    <!-- PapaParse pour parser le CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <h1>Projets Hypermedia</h1>
    <div id="projects-container"></div>

    <script>
        // Lien CSV publié Google Sheets
        const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTUFXMInGPyLiSOswMpHCzhrsKUHaRgZQrp7pEQQ8FPSgIL12YC5KLjkIpofeAL6UndiS4ulKX9GD12/pub?gid=1627457581&single=true&output=csv';

        async function fetchProjectsCSV() {
            try {
                const response = await fetch(url);
                const csvText = await response.text();
                const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
                const data = parsed.data;

                const container = document.getElementById("projects-container");
                container.innerHTML = "";

                data.forEach(project => {
                    const card = document.createElement("div");
                    card.className = "project-card";

                    if(project["Icône ou logo du projet"]) {
                        const logo = document.createElement("img");
                        logo.src = project["Icône ou logo du projet"];
                        logo.alt = project["Titre du projet"] + " logo";
                        card.appendChild(logo);
                    }

                    const title = document.createElement("h2");
                    title.textContent = project["Titre du projet"];
                    card.appendChild(title);

                    const desc = document.createElement("p");
                    desc.textContent = project["Description détaillée"];
                    card.appendChild(desc);

                    if(project["Visuel du projet (image ou vidéo)"]) {
                        const url = project["Visuel du projet (image ou vidéo)"];
                        if(url.match(/\.(jpeg|jpg|gif|png)$/i)) {
                            const img = document.createElement("img");
                            img.src = url;
                            card.appendChild(img);
                        } else {
                            const video = document.createElement("iframe");
                            video.src = url;
                            video.frameBorder = "0";
                            video.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                            video.allowFullscreen = true;
                            card.appendChild(video);
                        }
                    }

                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Erreur lors de la récupération des projets :", error);
            }
        }

        fetchProjectsCSV();
    </script>
</body>
</html>
