<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Projets THYP 25-26</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div class="container py-4">
    <header class="mb-3">
      <h1 class="h3 mb-1">THYP 25-26 — Projets</h1>
      <div class="text-muted">Source : Google Sheets</div>
    </header>

    <!-- Barre outils -->
    <div class="searchbar mb-3">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-6">
          <input id="q" class="form-control form-control-lg" placeholder="Rechercher (titre, résumé, techno…)">
        </div>
        <div class="col-6 col-md-3">
          <select id="keySelect" class="form-select">
            <option value="">— Filtrer par colonne —</option>
          </select>
        </div>
        <div class="col-6 col-md-3 text-md-end">
          <a id="downloadCsv" class="btn btn-outline-primary" target="_blank" rel="noopener">Télécharger le CSV</a>
        </div>
      </div>
    </div>

    <!-- Résumé -->
    <div class="mt-3 mb-2">
      <span id="count" class="muted">Chargement…</span>
    </div>

    <!-- Grille cartes -->
    <div id="grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
