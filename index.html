<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Projets Hypermédias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container my-4">
    <h1 class="mb-4">Projets Hypermédias</h1>

    <!-- Zone de recherche -->
    <div class="row mb-3">
      <div class="col-md-6">
        <input type="text" id="q" class="form-control" placeholder="Rechercher...">
      </div>
      <div class="col-md-4">
        <select id="keySelect" class="form-select">
          <option value="">Toutes les colonnes</option>
        </select>
      </div>
      <div class="col-md-2 text-end">
        <a id="downloadCsv" class="btn btn-outline-secondary" href="#" target="_blank">Télécharger CSV</a>
      </div>
    </div>

    <p id="count" class="text-muted"></p>

    <!-- Grille de cartes -->
    <div id="grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
